survey.eyebrow=БІР СТУДЕНТ · БІР ТАПСЫРМА
survey.subtitle=Жауабыңыз жұмысты бастау уақыты мен уақтылы тапсырудың байланысын зерттеуге көмектеседі.
survey.assignment=Соңғы 14 күнде бастапқы тапсыру мерзімі өткен ең соңғы жеке тапсырмаңызды еске түсіріңіз. Әлі тапсырмасаңыз да, барлық сұраққа осы бір тапсырма туралы жауап беріңіз.
survey.instructions=Бастапқы мерзім — кейінгі өзгерістерге дейін белгіленген күн мен уақыт. Жұмысты бастау — шартты жай оқу емес, тапсырманы орындауға кірісу. Күнтізбелік күндерді санаңыз: сәрсенбіден жұмаға дейін — 2 күн. Қатысу ерікті.
survey.privacy=Аты-жөніңіз бен email жиналмайды. Бір рет қана жауап беріңіз: осы жерде немесе Google Forms арқылы.
