connection.import=Жауаптарды импорттауды ашу
connection.limitsTitle=Бұл деректер кімді сипаттайды?
connection.limits=Мақсат — 120-дан астам жарамды жауап. Іріктеме ерікті әрі кездейсоқ емес: ол университеттің барлық студенттерін емес, жауап бергендерді сипаттайды. Белгісіз және әлі аяқталмаған нәтижелер бөлек сақталады. Демо тек ойдан шығарылған жауаптардан тұрады. Байқалған байланыс себептілікті дәлелдемейді.
