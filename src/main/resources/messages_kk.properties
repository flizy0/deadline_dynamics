connection.title=Деректер қайдан алынды?
connection.eyebrow=СТУДЕНТТЕР САУАЛНАМАСЫ
connection.subtitle=Әр жауап бір студент пен жақында берілген бір жеке тапсырманы сипаттайды.
connection.questionnaireTitle=Қандай жауаптар жинаймыз?
connection.questionnaire=Берілген мерзім, жұмысты бастау, тапсыру, мерзім өзгерісі, жоспарлау, күрделілік және басқа дедлайндар туралы 8 сұрақ. Тапсырманың бастапқы мерзімі соңғы 14 күнде өтуі керек. Сайтта қазақ, орыс немесе ағылшын тілін таңдауға болады. Аты-жөні, тобы мен email сұралмайды.
connection.google=Google Forms сауалнамасы
connection.website=Сайтта жауап беру
connection.once=Бір адам бір арна арқылы жауап береді. Сайт пен Google Forms арасындағы қайталанған анонимді жауаптарды автоматты анықтау мүмкін емес.
connection.collectionTitle=Жауаптар зерттеуге қалай қосылады?
connection.collection=Сайттағы жауаптар PostgreSQL базасына бірден сақталады. Google Forms жауаптарын зерттеуші CSV арқылы импорттайды. Көрсеткіштер бет ашылғанда қайта есептеледі; Google Forms-пен автоматты синхрондау жоқ.
