admin.preparation=Google Forms-та «Жауаптар» бөлімін ашып, үш нүктелі мәзірден CSV жүктеп алыңыз. ZIP архивін алдымен ашыңыз. Байланыстырылған Google Sheets кестесін де CSV түрінде жүктеуге болады.
admin.validation=5 МБ және 5000 жолға дейін. Бастапқы үштілді сұрақтар мен жауаптар кодтарды өзгертпей танылады. Қосымша жеке деректер сақталмайды. Кез келген жолдағы қате немесе қайшылық бүкіл импортты тоқтатады.
admin.idempotence=Толық файлды жүктеңіз. Қайта импорттау көшірме қоспайды; уақыт белгісі бірдей екі қатысушының бірдей жауаптары бөлек сақталады. Google CSV-де жауап ID-і жоқ: өзгертілген ескі жол жаңа жауап болып есептеледі. Бұрын импортталған жолдарды тексерусіз өзгертпеңіз не көшірмеңіз.
admin.template=Екі мысалы бар техникалық CSV үлгісін жүктеу
admin.noExamples=Оқу мысалдарын нақты іріктемеге импорттамаңыз. Демо зерттеу бетінде бөлек қолжетімді.
