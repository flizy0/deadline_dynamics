survey.error.beforeAssigned=Жұмыстың басталуы тапсырма берілген уақыттан бұрын көрсетілген. Берілген мерзім мен бастау уақытын тексеріңіз.
survey.error.notStarted=Жұмыс әлі басталмаса, тапсырма тапсырылды деп көрсетуге болмайды.
survey.error.afterDeadline=Бастапқы мерзім өткеннен кейін бастау уақтылы тапсыруға сәйкес келмейді.
