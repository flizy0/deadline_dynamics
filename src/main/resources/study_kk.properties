study.notation.describe=N — белгісіз жауаптарды қоса алғанда, талапқа сай бақылаулар саны; y_j — j жауабы, c_i — i санаты. Үлестер N > 0 кезінде анықталады.
study.notation.compare=S — уақытында тапсырғандар саны; L — кеш тапсырғандар саны. Бақыланған p̂ үлестері 0 мен 1 аралығындағы сандармен берілген.
study.notation.model=X — уақытында тапсырғандар саны; n — модельдегі топ көлемі; k — сәтті нәтижелер саны; p — бір адамның уақытында тапсыру ықтималдығы, 0 мен 1 аралығында.
study.notation.simulation=M — симуляция саны; H — таңдалған оқиға орындалған симуляциялар саны. Мұндағы оқиға: X ≥ k.
study.notation.grouping=M — модельденген топтар саны; x_min және x_max — бақыланған уақытында тапсыру сандары. Сауалнамадағы жауап аралықтары тең енді сандық кластарға айналмай, санат күйінде қалады.
study.formula.used=Қолданылуы:
study.formula.frequency.name=Абсолюттік жиілік
study.formula.frequency.meaning=f_i — жауабы i санатына жататын бақылаулар саны.
study.formula.frequency.use=Жеті сауалнама белгісінің жауаптарын деректер кестелері мен диаграммаларында санау.
study.formula.relative.name=Салыстырмалы жиілік
study.formula.relative.meaning=r_i — N бақылау ішіндегі санат үлесі; 0 мен 1 аралығындағы сан.
study.formula.relative.use=Санат көлемдерін салыстыру және пайыздарды есептеу.
study.formula.percentage.name=Пайыздық үлес
study.formula.percentage.meaning=q_i — санат үлесінің пайызбен берілген мәні.
study.formula.percentage.use=Шолудағы, деректер диаграммалары мен нақты кестелердегі үлестірім пайыздары.
study.formula.mode.name=Мода
study.formula.mode.meaning=Белгілі жауаптар ішіндегі ең үлкен оң f_max жиілігіне ие санат. Жиіліктер тең болса, мода бірнешеу; барлық жиілік нөл болса, мода жоқ.
study.formula.mode.use=Ең жиі кездесетін жауапты анықтау; белгісіз санат есепке алынбайды.
study.formula.observed.name=Уақытында тапсырудың бақыланған ықтималдығы
study.formula.observed.meaning=Аяқталған, нәтижесі белгілі тапсырмалар ішіндегі уақытында тапсыру үлесі. Әлі тапсырылмаған және белгісіз нәтижелер бөлімге кірмейді.
study.formula.observed.use=Шолудың негізгі нәтижесі, санаттарды салыстыру және зертханадағы бақыланған p.
study.formula.difference.name=Пайыздық пункттер айырмасы
study.formula.difference.meaning=Екі үлестің пайыздық шкаладағы айырмасы. Пайыздық өзгеріс p̂₂ > 0 кезінде 100(p̂₁ − p̂₂)/p̂₂ түрінде есептеледі.
study.formula.difference.use=Топтардың бақыланған үлестерін салыстыру. Оң мән бірінші үлестің жоғары екенін білдіреді.
study.formula.combinations.name=Терулер саны
study.formula.combinations.meaning=Ретін ескермей, n студенттен k студентті таңдау тәсілдерінің саны.
study.formula.combinations.use=0 ≤ k ≤ n кезінде биномиалдық ықтималдықтың коэффициенті.
study.formula.binomial.name=Биномиалдық ықтималдық функциясы
study.formula.binomial.meaning=p бірдей n тәуелсіз сынақта дәл k сәтті нәтиже алу ықтималдығы. p = 0 немесе 1 болса, X міндетті түрде 0 немесе n болады.
study.formula.binomial.use=Зертханада уақытында тапсырғандар санының теориялық үлестірімі.
study.formula.expected.name=Математикалық күтім
study.formula.expected.meaning=Топтарды көп рет қайталағандағы уақытында тапсырғандардың орташа саны; жеке топтың нәтижесі өзгеше болуы мүмкін.
study.formula.expected.use=Зертханадағы күтілетін сан және модельденген топтарды салыстыру.
study.formula.variance.name=Биномиалдық дисперсия
study.formula.variance.meaning=X мәнінің np мәнінен ауытқу квадратының орташа шамасы; өлшемі — нәтиже санының квадраты.
study.formula.variance.use=Биномиалдық модельдің теориялық шашырауын сипаттау.
study.formula.deviation.name=Биномиалдық стандартты ауытқу
study.formula.deviation.meaning=Студенттер санының бірлігіндегі теориялық шашырау; дисперсияның квадрат түбірі.
study.formula.deviation.use=Биномиалдық модель. Топталған симуляцияның іріктемелік ауытқуы M − 1 бөлгішін қолданады.
study.formula.tail.name=«Кемінде k» ықтималдығы
study.formula.tail.meaning=Кемінде k уақытында тапсыру ықтималдығы: k-дан n-ге дейінгі ықтималдықтар қосындысы.
study.formula.tail.use=Зертханада шекті оқиғаны бағалау және теорияны симуляциямен салыстыру.
study.formula.empirical.name=Эмпирикалық ықтималдық
study.formula.empirical.meaning=M қайталанған симуляцияның ішіндегі X ≥ k шартын орындаған H симуляцияның үлесі.
study.formula.empirical.use=Монте-Карло бағалауы және жинақталу графигі.
study.formula.error.name=Симуляция мен теорияның абсолюттік айырмасы
study.formula.error.meaning=Ықтималдық шкаласындағы айырма; 100ε — пайыздық пункттердегі айырма.
study.formula.error.use=Симуляцияны теориямен салыстыру; бұл сенімділік шекарасы емес.
study.formula.range.name=Құлаш
study.formula.range.meaning=Симуляцияда алынған уақытында тапсыру санының ең үлкен және ең кіші мәндерінің айырмасы.
study.formula.range.use=Симуляцияның сандық нәтижелерін топтау шекаралары.
study.formula.sturges.name=Стерджес ережесі
study.formula.sturges.meaning=Ұсынылатын кластар саны: K₀ ең жақын бүтін санға дөңгелектеледі, содан кейін K кемінде 1 деп алынады.
study.formula.sturges.use=Тек симуляцияның сандық нәтижелері; нақты аралықтар саны K-дан аз болуы мүмкін.
study.formula.width.name=Класс ені
study.formula.width.meaning=Шамамен C = R/K. Бүтін мәндер үшін жоба (R + 1)/K мәнін жоғары дөңгелектеп, кемінде 1 деп алады; қосылған 1 екі шеткі мәнді де қамтиды.
study.formula.width.use=Сандық симуляцияның [a, a + C − 1] аралықтары; соңғысы бақыланған максимумнан асып кетуі мүмкін.
study.example.title=Ағымдағы деректер бойынша есеп
study.example.onTime=Уақытында
study.example.late=Кеш
study.example.known=Белгілі нәтиже
study.example.empty=Бақыланған үлес анықталмаған: аяқталған, нәтижесі белгілі тапсырмалар әлі жоқ.
study.limitations.title=Шектеулер
study.limitations.sample=Ерікті, кездейсоқ емес іріктеме осы қатысушыларды сипаттайды. Қатысушылар көрсеткен уақыттар дәл емес немесе бір-біріне қайшы болуы мүмкін.
study.limitations.outcome=Үлестер аяқталған, нәтижесі белгілі тапсырмаларға қатысты; аяқталмаған және белгісіз нәтижелер есепке кірмейді.
study.limitations.association=Топтар айырмасы себептік әсерді немесе статистикалық мәнділікті емес, сипаттамалық байланысты көрсетеді.
study.limitations.model=Биномиалдық модель p бірдей тәуелсіз нәтижелерді болжайды. Симуляция сауалнама бақылауларының санын арттырмайды.
study.limits.causation=Бақыланған байланыс ертерек бастау уақытында тапсырудың себебі болғанын дәлелдемейді.
