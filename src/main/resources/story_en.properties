story.method.title=How do we move from responses to conclusions?
story.method.eyebrow=THE LOGIC OF THE STUDY
story.method.intro=From one assignment to distributions, group comparisons, and a probability experiment.
story.method.01.label=01 / RESEARCH QUESTION
story.method.01.title=Is starting time related to on-time submission?
story.method.01.copy=We study individual coursework assignments. The main variables are when work actually started and the outcome relative to the original deadline. We investigate association in the collected sample, rather than the cause of each student’s behaviour.
story.method.02.label=02 / HYPOTHESIS
story.method.02.title=What do we expect to see?
story.method.02.copy=Within the same assignment time band, we expect students who started at least one day earlier to have a higher on-time rate than those who started on the final day.
story.method.02.caveat=The hypothesis defines a direction to compare. Even a difference in that direction does not establish causation.
story.method.03.label=03 / ONE OBSERVATION
story.method.03.title=One student and one assignment
story.method.03.copy=One response describes the most recent individual assignment whose original deadline passed within the last 14 days. If several assignments share the latest deadline, one is selected. The 14 days are a recall window, not the time allowed for the assignment.
story.method.03.example=Starting work means actually doing the assignment, not just reading the instructions. We use calendar days: starting on Wednesday for a Friday deadline means two days earlier.
story.method.04.label=04 / COLLECTED VARIABLES
story.method.04.title=What does the questionnaire ask?
story.method.04.time=Time: how many days were allowed and when work started.
story.method.04.outcome=Outcome: on time, late, not submitted yet, or not remembered; deadline extensions are recorded separately.
story.method.04.context=Context: planning, reported difficulty, and other deadlines.
story.method.04.intervals=Time and workload are recorded as categories, including eight or more days and four or more assignments. Exact mean days cannot be recovered from these categories. Difficulty is an ordered self-report, not a continuous measurement.
story.method.05.label=05 / FREQUENCIES
story.method.05.title=How do we describe the responses?
story.method.05.copy=Frequency f is the number of responses in a category. Relative frequency is its share of N eligible responses. Unknown answers remain a separate category. The mode is the most frequent known answer; ties are all shown.
story.method.05.formula=Percentage = 100 × f / N
story.method.05.chart=For categories, we use bar charts starting at zero and retain the order of ordered responses. Open intervals are not treated as exact numerical observations.
story.method.05.action=Explore response distributions
story.method.06.label=06 / GROUP COMPARISON
story.method.06.title=Which groups are compared, and what is the denominator?
story.method.06.copy=The main comparison is students who started at least one day earlier versus students who started on the final day. We use one selected assignment time band of at least one day, without extensions. Other filters still apply. Students who started after the deadline or have not started are outside these two groups.
story.method.06.formula=On-time rate = on time / (on time + late)
story.method.06.denominator=Pending and not-remembered outcomes are excluded from the rate denominator but remain in frequency distributions. The difference between rates is measured in percentage points, not percentage growth.
story.method.06.other=Planning, difficulty, and workload comparisons are descriptive. A deadline extension means the original and newly agreed dates may differ.
story.method.07.label=07 / PROBABILITY MODEL
story.method.07.title=How does a survey proportion become a probability?
story.method.07.copy=In observed mode, p is the on-time rate among known outcomes in the selected sample. In manual mode, the user sets p. For a group of n simulated students, X is the number who submit on time.
story.method.07.assumptions=The binomial model assumes the same p for every student and independent outcomes. This is a simplification: real students and assignments differ.
story.method.08.label=08 / SIMULATION
story.method.08.title=What happens when we repeat the experiment?
story.method.08.copy=Each repetition creates a new group of n students. We count on-time submissions, build the empirical distribution, and compare it with binomial theory. The tail X ≥ k means at least k on-time submissions.
story.method.08.convergence=The convergence chart shows the estimated tail probability as more repetitions accumulate. The Law of Large Numbers explains its approach to the theoretical probability; individual stretches may temporarily move away.
story.method.08.sample=More simulations do not increase the survey sample or remove uncertainty in the estimated p. The same seed reproduces the experiment; theory is calculated in Java with Apache Commons Math.
story.method.09.label=09 / LIMITATIONS
story.method.09.title=Why does association not prove causation?
story.method.09.copy=The survey is voluntary and non-random. Responses depend on memory. Workload, difficulty, experience, and other factors may be related to both starting time and submission. Even 120 or more responses do not make the sample representative of all students.
story.method.09.small=The warning below 20 known outcomes in a group is a caution rule in the interface, not a statistical test. We do not label a descriptive difference statistically significant.
story.method.09.demo=Demo responses are fictional and are not research evidence. Real and demo data are kept separate. Simulation illustrates probability, not causal prediction.
story.quiz.eyebrow=CHECK YOUR INTUITION
story.quiz.title=Does it have to be exactly six?
story.quiz.question=If the on-time probability is 30%, must exactly 6 students in a group of 20 submit on time?
story.quiz.yes=Yes, because 30% of 20 equals 6
story.quiz.no=No, the outcome of one group is random
story.quiz.check=Check answer
story.quiz.correct=Correct.
story.quiz.incorrect=Not quite.
story.quiz.explanation=6 is the expected value. One group may produce another result; across many groups, the average approaches 6.
story.quiz.action=Try it in the lab
