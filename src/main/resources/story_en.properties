story.limitations.title=What can we conclude, and what can we not conclude?
story.limitations.copy=We describe this voluntary, non-random sample. It does not represent all students. Memory, workload, difficulty, and experience may be related to both starting time and the outcome. The observed difference does not establish causation or statistical significance.
