connection.title=Откуда взялись данные?
connection.eyebrow=СОБСТВЕННЫЙ ОПРОС СТУДЕНТОВ
connection.subtitle=Каждый ответ описывает одного студента и одно недавнее индивидуальное задание.
connection.questionnaireTitle=Какие ответы мы собираем?
connection.questionnaire=8 вопросов о выданном сроке, начале работы, сдаче, продлениях, планировании, сложности и других дедлайнах. Первоначальный срок задания должен был пройти за последние 14 дней. На сайте можно выбрать казахский, русский или английский язык. Имя, группа и email не запрашиваются.
connection.google=Опрос в Google Forms
connection.website=Ответить на сайте
connection.once=Один человек отвечает через один канал. Анонимные повторные ответы между сайтом и Google Forms автоматически распознать нельзя.
connection.collectionTitle=Как ответы попадают в исследование?
connection.collection=Ответы с сайта сразу сохраняются в PostgreSQL. Ответы Google Forms исследователь переносит через CSV-импорт. Показатели пересчитываются при открытии страницы; автоматической синхронизации с Google Forms нет.
connection.count=Подходящих наблюдений в базе: {0}.
connection.import=Открыть импорт ответов
connection.limitsTitle=Кого описывают эти данные?
connection.limits=Цель — 120+ подходящих ответов. Выборка добровольная и неслучайная: она описывает ответивших студентов, а не всех студентов университета. Неизвестные и ещё не завершённые результаты сохраняются отдельно. Демо — только вымышленные ответы. Наблюдаемая связь не доказывает причинность.
