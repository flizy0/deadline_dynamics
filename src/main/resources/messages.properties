error.title=Не удалось открыть страницу или выполнить действие
error.description=Проверьте адрес и параметры запроса. Если загружали файл, проверьте его размер и формат. Ранее сохранённые ответы остаются в базе.
error.forbidden=Сессия истекла или нет доступа. Откройте форму заново и повторите действие.
error.home=Вернуться к исследованию
