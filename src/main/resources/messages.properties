admin.preparationTitle=Как подготовить выгрузку?
admin.preparation=В Google Forms откройте «Ответы», меню с тремя точками и скачайте CSV. ZIP сначала распакуйте. Можно также скачать CSV связанной таблицы Google Sheets.
admin.validation=До 5 МБ и 5000 строк. Исходные трёхъязычные вопросы и ответы распознаются без изменения кодов. Дополнительные персональные поля не сохраняются. Ошибка или противоречие в любой строке отклоняет весь импорт.
admin.idempotence=Загружайте полную выгрузку. Повторный импорт не добавляет дубликаты; одинаковые ответы двух участников с одной отметкой времени сохраняются отдельно. Google CSV не содержит ID ответа: изменённая старая строка будет считаться новой. Не редактируйте и не копируйте уже импортированные строки без сверки.
admin.template=Скачать технический шаблон CSV с двумя примерами
admin.noExamples=Не импортируйте учебные примеры в реальную выборку. Демо доступно отдельно на странице исследования.
