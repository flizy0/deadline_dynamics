survey.title=Когда начали работу и когда сдали?
survey.eyebrow=ОДИН СТУДЕНТ · ОДНО ЗАДАНИЕ
survey.subtitle=Ваш ответ поможет изучить связь между началом работы и сдачей вовремя.
survey.assignment=Вспомните последнее индивидуальное задание, первоначальный дедлайн которого прошёл за последние 14 дней. Отвечайте об этом одном задании, даже если вы пока его не сдали.
survey.instructions=Первоначальный дедлайн — дата и время до переносов. Начать работу — приступить к выполнению, а не просто прочитать условие. Считайте календарные дни: со среды до пятницы — 2 дня. Участие добровольное.
survey.privacy=Имя и email не собираем. Ответьте один раз: здесь или в Google Forms, не в обоих местах.
survey.submit=Отправить ответ
survey.error.eligible=Ответьте на первый вопрос.
survey.error.required=Выберите ответ на каждый обязательный вопрос.
survey.error.field=Выберите ответ: {0}.
survey.error.beforeAssigned=Начало работы указано раньше выдачи задания. Проверьте выданный срок и начало работы.
survey.error.notStarted=Нельзя указать, что задание сдано, если работа ещё не начата.
survey.error.afterDeadline=Начало после первоначального дедлайна несовместимо со сдачей вовремя.
survey.error.plan=Ответ «ещё не начал» в планировании противоречит указанному началу работы или сдаче.
survey.error.storage=База временно недоступна. Ответ не подтверждён, попробуйте ещё раз.
