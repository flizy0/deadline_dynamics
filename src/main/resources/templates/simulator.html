<!DOCTYPE html>
<html lang="ru" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{lab.title})}"></head>
<body>
<a class="skip-link" href="#main" th:text="#{common.skip}"></a>
<div class="app-shell">
    <aside th:replace="~{fragments :: sidebar}"></aside>
    <th:block th:replace="~{fragments :: utilityBar(#{lab.title})}"></th:block>
    <main id="main" class="main-content probability-lab" data-workspace>
        <header class="page-heading"><div><p class="eyebrow" th:text="#{lab.eyebrow}"></p><h1 th:text="#{lab.title}"></h1><p class="page-subtitle" th:text="#{lab.intro}"></p></div></header>
        <div class="notice notice-error" role="alert" th:if="${errorKey != null}" th:text="${#messages.msg(errorKey)}"></div>
        <section class="lab-setup" aria-labelledby="lab-setup-title">
            <div class="lab-section-heading"><span class="lab-step" aria-hidden="true">01</span><div><h2 id="lab-setup-title" th:text="#{lab.setup.title}"></h2></div></div>
            <form id="lab-form" method="get" th:action="@{/simulator}">
                <input type="hidden" name="dataset" th:value="${dataset}">
                <input type="hidden" name="mode" th:value="${source == 'custom' ? 'manual' : 'observed'}" data-lab-legacy-mode>
                <fieldset class="lab-mode-field"><legend th:text="#{lab.mode.label}"></legend><div class="lab-mode-options"><label><input type="radio" name="labMode" value="single" th:checked="${labMode == 'single'}" data-lab-mode><span th:text="#{lab.mode.single}"></span></label><label><input type="radio" name="labMode" value="compare" th:checked="${labMode == 'compare'}" data-lab-mode><span th:text="#{lab.mode.compare}"></span></label></div></fieldset>
                <fieldset class="lab-source-field" th:if="${labMode == 'single'}"><legend th:text="#{lab.source.label}"></legend><div class="lab-source-options">
                    <label th:each="scenario : ${labScenarios}" th:classappend="${scenario.code() == source ? 'selected' : ''}"><input type="radio" name="source" th:value="${scenario.code()}" th:checked="${scenario.code() == source}" data-lab-source><span th:text="#{${'lab.source.'+scenario.code()}}"></span><small th:if="${scenario.probability() != null}" th:text="${#numbers.formatDecimal(scenario.probability()*100,1,1)+'%'}"></small><small th:if="${scenario.probability() == null}" th:text="#{lab.noEstimate}"></small></label>
                    <label th:classappend="${source == 'custom' ? 'selected' : ''}"><input type="radio" name="source" value="custom" th:checked="${source == 'custom'}" data-lab-source><span th:text="#{lab.source.custom}"></span><small th:text="#{lab.source.custom.note}"></small></label>
                </div></fieldset>
                <input th:if="${labMode == 'compare'}" type="hidden" name="source" th:value="${source}">
                <div class="lab-primary-controls">
                    <label class="field-label lab-manual-control" data-lab-manual th:hidden="${source != 'custom' or labMode == 'compare'}"><span th:text="#{lab.custom.p}"></span><span class="lab-probability-input"><input type="number" name="p" min="0" max="100" step="0.1" inputmode="decimal" th:value="${p}" th:disabled="${source != 'custom' or labMode == 'compare'}" data-lab-p><span>%</span></span><input type="range" min="0" max="100" step="0.1" th:value="${p}" th:aria-label="#{lab.custom.p}" data-lab-p-range></label>
                    <label class="field-label lab-size-control"><span th:text="#{lab.size}"></span><span class="number-stepper"><button type="button" class="icon-button" data-lab-step="-1" th:aria-label="#{lab.size.minus}" th:title="#{lab.size.minus}"><i data-lucide="minus" aria-hidden="true"></i></button><input type="number" name="size" min="1" max="100" step="1" required th:value="${size}" data-lab-size><button type="button" class="icon-button" data-lab-step="1" th:aria-label="#{lab.size.plus}" th:title="#{lab.size.plus}"><i data-lucide="plus" aria-hidden="true"></i></button></span></label>
                    <button class="button" type="submit" name="stage" value="group" data-lab-run-group><i data-lucide="play" aria-hidden="true"></i><span th:text="${labMode == 'compare'} ? #{lab.run.pair} : #{lab.run.group}"></span></button>
                </div>
                <input th:if="${stage != 'repeat'}" type="hidden" name="threshold" th:value="${threshold}" data-lab-hidden-threshold>
                <details class="lab-advanced" th:open="${errorKey == 'experiment.error.numbers'}"><summary th:text="#{lab.advanced.settings}"></summary><div class="lab-advanced-controls">
                    <label class="field-label"><span th:text="#{lab.comparison.band}"></span><select name="compareBand"><th:block th:each="item : ${bands}"><option th:if="${item.key != 'SAME_DAY' and item.key != 'UNKNOWN'}" th:value="${item.key}" th:text="#{${'option.allottedBand.'+item.key}}" th:selected="${compareBand == item.key}"></option></th:block></select><small th:text="#{lab.comparison.band.note}"></small></label>
                    <label class="field-label"><span th:text="#{lab.runs.exact}"></span><input type="number" name="runs" min="1" max="50000" step="1" required th:value="${runs}" data-lab-runs-input></label>
                    <label class="field-label"><span th:text="#{lab.seed}"></span><input type="number" name="seed" step="1" th:value="${param.seed != null ? seed : ''}"><small th:text="#{lab.seed.note}"></small></label>
                </div><div th:replace="~{fragments :: filters}"></div><label class="check-label"><input type="checkbox" name="excludeExtensions" value="true" th:checked="${filter.excludeExtensions()}"><span th:text="#{lab.filter.extensions}"></span></label><p class="lab-caption" th:text="#{lab.comparison.rule}"></p></details>
            </form>
        </section>
        <section class="lab-source-story" th:if="${labMode == 'single' and selectedScenario != null}"><h2 th:text="#{lab.observed.question}"></h2><p th:if="${selectedScenario.probability() != null}" th:text="#{lab.observed.ratio(${selectedScenario.summary().onTime()},${selectedScenario.summary().known()},${#numbers.formatDecimal(selectedScenario.probability()*100,1,1)})}"></p></section>
        <section class="lab-source-story" th:if="${labMode == 'single' and source == 'custom'}"><h2 th:text="#{lab.custom.question}"></h2><p th:text="#{lab.custom.note}"></p></section>
        <p class="lab-caption" th:if="${labMode == 'compare' or source == 'earlier' or source == 'final'}" th:text="${#messages.msg('lab.comparison.band') + ': ' + #messages.msg('option.allottedBand.' + compareBand)}"></p>
        <section class="lab-source-story" th:if="${labMode == 'compare'}"><h2 th:text="#{lab.compare.question}"></h2><div class="lab-scenario-context"><th:block th:each="scenario : ${labScenarios}"><div th:if="${scenario.code() != 'overall'}"><span th:text="#{${'lab.source.'+scenario.code()}}"></span><strong th:text="${scenario.probability() != null ? #numbers.formatDecimal(scenario.probability()*100,1,1)+'%' : #messages.msg('lab.noEstimate')}"></strong><p th:text="#{lab.observed.count(${scenario.summary().onTime()},${scenario.summary().known()})}"></p></div></th:block></div></section>
        <section class="empty-state lab-empty" th:if="${(labMode == 'single' and emptySimulation == true) or (labMode == 'compare' and comparisonMissing == true)}"><h2 th:text="#{lab.empty.title}"></h2><p th:text="${labMode == 'compare'} ? #{lab.empty.compare} : #{lab.empty.body}"></p></section>
        <th:block th:if="${(labMode == 'single' and result != null) or (labMode == 'compare' and labComparison != null)}">
            <section class="lab-group-section" aria-labelledby="lab-group-title"><div class="lab-section-heading"><span class="lab-step" aria-hidden="true">02</span><div><h2 id="lab-group-title" th:text="#{lab.group.title(${size})}"></h2><p th:text="#{lab.group.question}"></p></div></div>
                <div class="lab-groups" th:classappend="${labMode == 'compare' ? 'lab-groups-pair' : ''}">
                    <article th:if="${labMode == 'single'}" class="lab-group" data-lab-group="single"><div class="lab-group-heading"><h3 th:text="#{${'lab.source.'+source}}"></h3><span th:text="#{lab.group.p(${#numbers.formatDecimal(result.probability()*100,1,1)})}"></span></div><div class="lab-marks" data-lab-dots aria-hidden="true"><span th:each="success : ${result.firstGroup()}" th:class="${success ? 'lab-mark is-success' : 'lab-mark is-late'}" th:text="${success ? '+' : '-'}"></span></div><div class="lab-group-totals" aria-live="polite"><div><span th:text="#{lab.onTime}"></span><strong data-lab-success th:text="${result.firstResult()+' / '+result.size()}"></strong></div><div><span th:text="#{lab.late}"></span><strong data-lab-late th:text="${(result.size()-result.firstResult())+' / '+result.size()}"></strong></div></div></article>
                    <th:block th:if="${labMode == 'compare'}"><article th:replace="~{simulator :: group('earlier', ${labComparison.earlier()})}"></article><article th:replace="~{simulator :: group('final', ${labComparison.finalDay()})}"></article></th:block>
                </div><div class="lab-group-bottom"><p th:text="#{lab.group.random}"></p><button class="button button-secondary" type="button" data-lab-another><i data-lucide="refresh-cw" aria-hidden="true"></i><span th:text="${labMode == 'compare'} ? #{lab.group.anotherPair} : #{lab.group.another}"></span></button></div><p class="notice notice-error" role="alert" data-lab-group-error hidden></p>
            </section>
            <section class="lab-repetition" aria-labelledby="lab-repeat-title"><div class="lab-section-heading"><span class="lab-step" aria-hidden="true">03</span><div><h2 id="lab-repeat-title" th:text="#{lab.repeat.title}"></h2></div></div><div class="lab-repeat-controls"><div class="lab-run-presets" th:aria-label="#{lab.runs.label}"><button type="button" data-lab-runs="100" th:aria-pressed="${runs == '100'}">100</button><button type="button" data-lab-runs="1000" th:aria-pressed="${runs == '1000'}">1 000</button><button type="button" data-lab-runs="10000" th:aria-pressed="${runs == '10000'}">10 000</button><button type="button" data-lab-runs="50000" th:aria-pressed="${runs == '50000'}">50 000</button></div><button class="button" type="submit" form="lab-form" name="stage" value="repeat" data-lab-repeat><i data-lucide="play" aria-hidden="true"></i><span th:text="#{lab.run.experiment}"></span></button></div></section>
            <th:block th:if="${stage == 'repeat'}">
                <section class="lab-distribution-section" aria-labelledby="lab-distribution-title"><div class="lab-section-heading"><span class="lab-step" aria-hidden="true">04</span><div><h2 id="lab-distribution-title" th:text="${labMode == 'compare'} ? #{lab.distribution.compare} : #{lab.distribution.title}"></h2><p th:text="#{lab.distribution.runs(${runs})}"></p></div></div>
                    <div class="lab-distribution-toolbar"><div class="lab-series-options"><label class="check-label"><input type="checkbox" checked data-lab-series="simulation"><span th:text="#{lab.series.simulation}"></span></label><label class="check-label"><input type="checkbox" checked data-lab-series="theory"><span th:text="#{lab.series.theory}"></span></label></div></div>
                    <div class="lab-chart-frame"><canvas id="lab-distribution" role="img" th:aria-label="#{lab.distribution.accessible}"><span th:text="#{lab.chart.fallback}"></span></canvas></div>
                    <div class="lab-expectations" th:if="${labMode == 'single'}"><span th:text="#{lab.expected(${#numbers.formatDecimal(result.expected(),1,2)})}"></span><span th:text="#{lab.mean(${#numbers.formatDecimal(result.mean(),1,2)})}"></span></div>
                    <div class="lab-expectations" th:if="${labMode == 'compare'}"><span th:text="#{lab.compare.expectedEarlier(${#numbers.formatDecimal(labComparison.earlier().expected(),1,2)})}"></span><span th:text="#{lab.compare.expectedFinal(${#numbers.formatDecimal(labComparison.finalDay().expected(),1,2)})}"></span><span th:text="#{lab.compare.overlap(${#numbers.formatDecimal(labComparison.overlap()*100,1,1)})}"></span></div>
                    <div class="lab-threshold-workspace"><div><h3 th:text="#{lab.threshold.title(${threshold},${size})}"></h3></div><div class="lab-threshold-controls"><label><span th:text="#{lab.threshold.label}"></span><input type="number" name="threshold" form="lab-form" min="0" th:max="${size}" step="1" required th:value="${threshold}" data-lab-threshold></label><input type="range" min="0" th:max="${size}" step="1" th:value="${threshold}" th:aria-label="#{lab.threshold.label}" data-lab-threshold-range><button class="button button-secondary" type="submit" form="lab-form" name="stage" value="repeat" data-lab-apply-threshold><i data-lucide="check" aria-hidden="true"></i><span th:text="#{lab.threshold.apply}"></span></button></div><code th:text="${'P(X ≥ '+threshold+')'}"></code>
                        <div th:if="${labMode == 'single'}"><div th:replace="~{simulator :: tail('', ${result})}"></div></div><div th:if="${labMode == 'compare'}" class="lab-pair-tails"><div th:replace="~{simulator :: tail('earlier', ${labComparison.earlier()})}"></div><div th:replace="~{simulator :: tail('final', ${labComparison.finalDay()})}"></div></div>
                    </div>
                </section>
                <details class="lab-convergence-section" data-lab-convergence><summary th:text="#{lab.convergence.question}"></summary><h3 th:text="#{lab.convergence.title}"></h3><p class="lab-caption" th:text="#{lab.convergence.note}"></p><div class="lab-chart-frame"><canvas id="lab-convergence" role="img" th:aria-label="#{lab.convergence.accessible}"><span th:text="#{lab.chart.fallback}"></span></canvas></div><details class="lab-advanced"><summary th:text="#{lab.convergence.exact}"></summary><div th:if="${labMode == 'single'}"><div th:replace="~{simulator :: convergence('', ${result})}"></div></div><div th:if="${labMode == 'compare'}"><div th:replace="~{simulator :: convergence('earlier', ${labComparison.earlier()})}"></div><div th:replace="~{simulator :: convergence('final', ${labComparison.finalDay()})}"></div></div></details></details>
                <details class="lab-advanced lab-technical"><summary th:text="#{lab.advanced.results}"></summary><p class="lab-caption" th:text="#{lab.advanced.note}"></p><th:block th:if="${labMode == 'single'}"><div th:replace="~{simulator :: distribution('', ${result})}"></div><div th:replace="~{simulator :: numeric('', ${grouped})}"></div></th:block><th:block th:if="${labMode == 'compare'}"><div th:replace="~{simulator :: distribution('earlier', ${labComparison.earlier()})}"></div><div th:replace="~{simulator :: distribution('final', ${labComparison.finalDay()})}"></div><div th:replace="~{simulator :: numeric('earlier', ${earlierGrouped})}"></div><div th:replace="~{simulator :: numeric('final', ${finalGrouped})}"></div></th:block></details>
            </th:block>
            <script type="application/json" id="lab-experiment" th:inline="javascript">
                {
                    "mode": /*[[${labMode}]]*/ "single",
                    "stage": /*[[${stage}]]*/ "group",
                    "source": /*[[${source}]]*/ "overall",
                    "size": /*[[${labMode == 'compare' ? labComparison.earlier().size() : result.size()}]]*/ 20,
                    "result": /*[[${result}]]*/ null,
                    "comparison": /*[[${labComparison}]]*/ null,
                    "selectedScenario": /*[[${selectedScenario}]]*/ null,
                    "requestParameters": {
                        "dataset": /*[[${dataset}]]*/ "demo",
                        "allotted": /*[[${filter.allotted()}]]*/ "",
                        "start": /*[[${filter.start()}]]*/ "",
                        "planning": /*[[${filter.planning()}]]*/ "",
                        "excludeExtensions": /*[[${filter.excludeExtensions()}]]*/ false,
                        "compareBand": /*[[${compareBand}]]*/ "THREE_FOUR"
                    },
                    "labels": {
                        "simulation": /*[[#{lab.series.simulation}]]*/ "",
                        "theory": /*[[#{lab.series.theory}]]*/ "",
                        "earlier": /*[[#{lab.source.earlier}]]*/ "",
                        "final": /*[[#{lab.source.final}]]*/ "",
                        "x": /*[[#{lab.chart.x}]]*/ "",
                        "y": /*[[#{lab.chart.y}]]*/ "",
                        "runs": /*[[#{lab.chart.runs}]]*/ "",
                        "tail": /*[[#{lab.chart.tail}]]*/ "",
                        "groupError": /*[[#{lab.group.error}]]*/ "",
                        "groupLoading": /*[[#{lab.group.loading}]]*/ "",
                        "threshold": /*[[#{lab.threshold.label}]]*/ ""
                    }
                }
            </script>
        </th:block>
        <footer th:replace="~{fragments :: footer}"></footer>
    </main>
</div>
<th:block th:remove="all">
    <article class="lab-group" th:fragment="group(code, experiment)" th:attr="data-lab-group=${code}"><div class="lab-group-heading"><h3 th:text="#{${'lab.source.'+code}}"></h3><span th:text="#{lab.group.p(${#numbers.formatDecimal(experiment.probability()*100,1,1)})}"></span></div><div class="lab-marks" data-lab-dots aria-hidden="true"><span th:each="success : ${experiment.firstGroup()}" th:class="${success ? 'lab-mark is-success' : 'lab-mark is-late'}" th:text="${success ? '+' : '-'}"></span></div><div class="lab-group-totals" aria-live="polite"><div><span th:text="#{lab.onTime}"></span><strong data-lab-success th:text="${experiment.firstResult()+' / '+experiment.size()}"></strong></div><div><span th:text="#{lab.late}"></span><strong data-lab-late th:text="${(experiment.size()-experiment.firstResult())+' / '+experiment.size()}"></strong></div></div></article>
    <div th:fragment="tail(code, experiment)" class="lab-tail-result"><h4 th:if="${code != ''}" th:text="#{${'lab.source.'+code}}"></h4><dl><div><dt th:text="#{lab.series.theory}"></dt><dd th:text="${#numbers.formatDecimal(experiment.theoreticalTail()*100,1,2)+'%'}"></dd></div><div><dt th:text="#{lab.series.simulation}"></dt><dd th:text="${#numbers.formatDecimal(experiment.empiricalTail()*100,1,2)+'%'}"></dd></div><div><dt th:text="#{lab.difference}"></dt><dd th:text="#{lab.pp(${#numbers.formatDecimal(experiment.absoluteTailDifference()*100,1,2)})}"></dd></div></dl></div>
    <div th:fragment="distribution(code, experiment)" class="lab-exact-data"><h3 th:if="${code != ''}" th:text="#{${'lab.source.'+code}}"></h3><p class="lab-caption" th:text="#{lab.seed.used(${experiment.seed()})}"></p><div class="table-scroll"><table><caption th:text="#{lab.exact.title}"></caption><thead><tr><th scope="col">X</th><th scope="col" th:text="#{lab.exact.count}"></th><th scope="col" th:text="#{lab.series.simulation}"></th><th scope="col" th:text="#{lab.series.theory}"></th><th scope="col" th:text="#{lab.exact.expected}"></th></tr></thead><tbody><tr th:each="bin : ${experiment.histogram()}"><th scope="row" th:text="${bin.value()}"></th><td th:text="${bin.observed()}"></td><td th:text="${#numbers.formatDecimal(bin.empiricalProbability()*100,1,2)+'%'}"></td><td th:text="${#numbers.formatDecimal(bin.theoreticalProbability()*100,1,2)+'%'}"></td><td th:text="${#numbers.formatDecimal(bin.expectedCount(),1,2)}"></td></tr></tbody></table></div></div>
    <div th:fragment="convergence(code, experiment)" class="lab-exact-data"><h4 th:if="${code != ''}" th:text="#{${'lab.source.'+code}}"></h4><div class="table-scroll"><table><caption class="sr-only" th:text="#{lab.convergence.exact}"></caption><thead><tr><th scope="col" th:text="#{lab.chart.runs}"></th><th scope="col" th:text="#{lab.series.simulation}"></th><th scope="col" th:text="#{lab.series.theory}"></th></tr></thead><tbody><tr th:each="point : ${experiment.convergence()}"><th scope="row" th:text="${point.runs()}"></th><td th:text="${#numbers.formatDecimal(point.empiricalProbability()*100,1,2)+'%'}"></td><td th:text="${#numbers.formatDecimal(experiment.theoreticalTail()*100,1,2)+'%'}"></td></tr></tbody></table></div></div>
    <div th:fragment="numeric(code, statistics)" class="lab-exact-data"><h4 th:if="${code != ''}" th:text="#{${'lab.source.'+code}}"></h4><div class="table-scroll"><table><caption th:text="#{lab.numeric.title}"></caption><thead><tr><th scope="col">N</th><th scope="col" th:text="#{lab.numeric.min}"></th><th scope="col" th:text="#{lab.numeric.max}"></th><th scope="col" th:text="#{lab.numeric.range}"></th><th scope="col" th:text="#{lab.numeric.mean}"></th><th scope="col" th:text="#{lab.numeric.median}"></th><th scope="col" th:text="#{lab.numeric.sd}"></th></tr></thead><tbody><tr><td th:text="${statistics.count()}"></td><td th:text="${statistics.minimum()}"></td><td th:text="${statistics.maximum()}"></td><td th:text="${statistics.range()}"></td><td th:text="${#numbers.formatDecimal(statistics.mean(),1,2)}"></td><td th:text="${#numbers.formatDecimal(statistics.median(),1,2)}"></td><td th:text="${statistics.deviation() != null ? #numbers.formatDecimal(statistics.deviation(),1,2) : #messages.msg('lab.numeric.minimumN')}"></td></tr></tbody></table></div><details class="lab-advanced"><summary th:text="#{lab.sturges.title}"></summary><p class="lab-caption" th:text="#{lab.sturges.note(${statistics.suggestedClasses()},${statistics.width()})}"></p><div class="table-scroll"><table><thead><tr><th scope="col" th:text="#{lab.sturges.interval}"></th><th scope="col" th:text="#{lab.exact.count}"></th><th scope="col">%</th><th scope="col" th:text="#{lab.sturges.cumulative}"></th></tr></thead><tbody><tr th:each="bin : ${statistics.bins()}"><th scope="row" th:text="${bin.lower()+'–'+bin.upper()}"></th><td th:text="${bin.count()}"></td><td th:text="${#numbers.formatDecimal(bin.percent(),1,1)+'%'}"></td><td th:text="${bin.cumulative()}"></td></tr></tbody></table></div></details></div>
</th:block>
</body>
</html>
