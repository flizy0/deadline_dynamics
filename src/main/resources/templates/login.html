<!DOCTYPE html>
<html lang="ru" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(#{login.title})}"></head><body><a class="skip-link" href="#main" th:text="#{common.skip}"></a><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><th:block th:replace="~{fragments :: utilityBar(#{login.title})}"></th:block><main id="main" class="main-content" data-workspace>
<header class="page-heading"><div><p class="eyebrow" th:text="#{login.eyebrow}"></p><h1 th:text="#{login.title}"></h1></div></header>
<form class="login-form" method="post" th:action="@{/login}"><p class="notice notice-error" th:if="${param.error != null}" role="alert" th:text="#{login.error}"></p><label><span th:text="#{login.username}"></span><input name="username" autocomplete="username" required maxlength="100"></label><label><span th:text="#{login.password}"></span><input type="password" name="password" autocomplete="current-password" required maxlength="200"></label><button class="button" type="submit"><i data-lucide="log-in" aria-hidden="true"></i><span th:text="#{login.submit}"></span></button></form><footer th:replace="~{fragments :: footer}"></footer></main></div></body></html>
