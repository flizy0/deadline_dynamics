<!DOCTYPE html>
<html lang="ru" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{survey.title})}"></head>
<body><a class="skip-link" href="#main" th:text="#{common.skip}"></a><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><th:block th:replace="~{fragments :: utilityBar(#{nav.survey})}"></th:block><main id="main" class="main-content survey-content" data-workspace>
<header class="page-heading"><div><p class="eyebrow" th:text="#{survey.eyebrow}"></p><h1 th:text="#{survey.title}"></h1><p class="page-subtitle" th:text="#{survey.subtitle}"></p></div></header>
<section class="survey-intro"><p th:text="#{survey.assignment}"></p><p th:text="#{survey.instructions}"></p><p class="notice" th:text="#{survey.privacy}"></p></section>
<div class="notice notice-error" role="alert" th:if="${error != null}" th:text="${error}"></div>
<form class="survey-form" method="post" th:action="@{/survey}">
<fieldset class="survey-question" th:each="question, status : ${questions}" th:attr="data-field=${question.field()}">
<legend><span class="question-number" th:text="${status.count}"></span><span th:text="#{${'question.' + question.field()}}"></span></legend>
<label class="answer-option" th:each="option : ${question.options()}"><input type="radio" th:name="${question.field()}" th:value="${option.code()}" th:checked="${values[question.field()] == option.code()}" th:required="${question.field() == 'eligible'}"><span th:text="#{${'option.' + question.field() + '.' + option.code()}}"></span></label>
</fieldset>
<button class="button" type="submit"><i data-lucide="send" aria-hidden="true"></i><span th:text="#{survey.submit}"></span></button>
</form><footer th:replace="~{fragments :: footer}"></footer></main></div></body></html>
