admin.preparationTitle=How should the export be prepared?
admin.preparation=In Google Forms, open Responses, use the three-dot menu and download CSV. Extract any ZIP archive first. A CSV download from the linked Google Sheets spreadsheet also works.
admin.validation=Maximum 5 MB and 5,000 rows. Original trilingual question and answer labels are recognized without changing codes. Extra personal fields are not stored. Any invalid or contradictory row rejects the entire import.
admin.idempotence=Upload the full export. Re-importing does not add duplicates; identical responses from two participants with the same timestamp remain separate. Google CSV has no response ID, so a changed old row is treated as new. Do not edit or copy previously imported rows without checking them.
admin.template=Download the canonical CSV template with two examples
admin.noExamples=Do not import example records into the real sample. The demo dataset is available separately on the study page.
