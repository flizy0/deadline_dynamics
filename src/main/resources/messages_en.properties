survey.title=When did you start and when did you submit?
survey.eyebrow=ONE STUDENT · ONE ASSIGNMENT
survey.subtitle=Your response helps us study the link between starting time and on-time submission.
survey.assignment=Think of your most recent individual assignment whose original deadline passed within the last 14 days. Answer about that one assignment, even if you have not submitted it yet.
survey.instructions=The original deadline is the date and time before any extension. Starting means doing the work, not just reading the instructions. Count calendar days: Wednesday to Friday is 2 days. Participation is voluntary.
survey.privacy=We do not collect names or email addresses. Respond once, either here or through Google Forms, not both.
