connection.title=Where do the data come from?
connection.eyebrow=OUR OWN STUDENT SURVEY
connection.subtitle=Each response describes one student and one recent individual assignment.
connection.questionnaireTitle=What responses do we collect?
connection.questionnaire=Eight questions cover allotted time, starting time, submission, extensions, planning, difficulty and other deadlines. The original deadline must have passed within the last 14 days. The website is available in Kazakh, Russian and English. We do not ask for names, groups or email addresses.
connection.google=Google Forms survey
connection.website=Respond on the website
connection.once=Each person responds through one channel. Anonymous duplicates between the website and Google Forms cannot be detected automatically.
connection.collectionTitle=How do responses enter the study?
connection.collection=Website responses are saved directly in PostgreSQL. The researcher imports Google Forms responses from a CSV file. Statistics are recalculated when a page is opened; Google Forms does not synchronize automatically.
connection.count=Eligible observations in the database: {0}.
connection.import=Open response import
connection.limitsTitle=Who do these data describe?
connection.limits=The target is 120 or more eligible responses. This voluntary, non-random sample describes respondents, not all students at the university. Unknown and pending outcomes are kept separately. Demo responses are fictional. Observed association does not prove causation.
