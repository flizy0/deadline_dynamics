story.empty.filteredTitle=По этим условиям ответов нет
story.empty.real=Реальных ответов пока нет. Сбор проводится через Google Forms. Пока можно изучить интерфейс на явно обозначенных вымышленных демоданных.
story.empty.filtered=Измените фильтры, чтобы увидеть другую часть текущего набора. Отсутствие ответов не означает отсутствие связи.
story.finding.title=Связано ли более раннее начало со сдачей вовремя?
story.finding.demo=ПРИМЕР НА ВЫМЫШЛЕННЫХ ДАННЫХ
story.finding.sample=НАБЛЮДЕНИЕ В ЭТОЙ ВЫБОРКЕ
story.group.earlier=Начали хотя бы за день
story.group.lastDay=Начали в день дедлайна
story.finding.fraction=Вовремя: {0} из {1} известных результатов
story.finding.difference=Разница: раньше минус последний день
story.finding.points=процентных пунктов
story.finding.higher=В этой выборке студенты, начавшие раньше, сдавали вовремя чаще.
story.finding.lower=В этой выборке доля сдачи вовремя ниже у начавших раньше. Это не соответствует направлению исходной гипотезы.
story.finding.equal=В этой выборке доли сдачи вовремя в двух группах равны.
story.finding.missing=Для сравнения нужны известные результаты в обеих группах. Сейчас хотя бы одна группа пуста; разницу оценить нельзя.
story.finding.small=В одной или обеих группах меньше 20 известных результатов. Разница показана описательно и чувствительна к отдельным ответам; устойчивый вывод пока не оправдан.
story.association=Это наблюдаемая связь. Данные не доказывают, что более раннее начало стало причиной различия.
story.summary.title=Что показывает выбранная часть данных?
story.summary.responses=Подходящих ответов
story.summary.known=Известных результатов: {0}
story.summary.onTime=Доля сдачи вовремя
story.summary.late=Сдали позже
story.summary.originalDeadline=Относительно первоначального срока
story.summary.pending=Пока не сдали
story.summary.excluded=Не входят в знаменатель доли
story.denominator=Известный результат: «вовремя» или «позже». Пока не сдали: {0}; не помнят результат: {1}. Эти ответы остаются в распределениях, но не входят в знаменатель доли сдачи вовремя.
story.start.title=Когда студенты обычно начинают?
story.start.view=Представление распределения начала работы
story.view.counts=Число ответов
story.view.percent=Доля, %
story.view.table=Таблица
story.view.bars=Столбцы
story.start.caption=Один ответ описывает одно последнее индивидуальное задание. Проценты рассчитаны от всех выбранных подходящих ответов; категории сохраняют порядок анкеты.
story.exactValues=Посмотреть точные значения
story.comparison.title=Как отличаются результаты двух групп?
story.comparison.context=Выданный срок: {0}. Сравниваем внутри этого срока, только без переноса. Остальные фильтры также действуют.
story.comparison.denominator=В каждой группе знаменатель — только «вовремя» и «позже». В сравнение не вошли {0} выбранных ответов: другие сроки или момент старта, переносы, пока не сданные и неизвестные результаты.
story.factors.eyebrow=КОНТЕКСТ, А НЕ ОБЪЯСНЕНИЕ ПРИЧИНЫ
story.factors.title=Какие ещё факторы могут быть связаны с результатом?
story.factors.intro=Планирование, параллельные дедлайны и сложность помогают описать выборку. Это отдельные сравнения; они не изолируют влияние каждого фактора.
story.planning.title=Связано ли планирование со сдачей вовремя?
story.workload.title=Что видно при разном числе других дедлайнов?
story.difficulty.title=Как выглядит сдача при разной сложности?
story.limitations.eyebrow=ГРАНИЦЫ ВЫВОДА
story.limitations.title=Что можно заключить, а что нельзя?
story.limitations.copy=Мы описываем ответы этой добровольной неслучайной выборки. Она не представляет всех студентов. Память, нагрузка, сложность и опыт могут влиять и на начало работы, и на результат. Наблюдаемая разница не доказывает причинность или статистическую значимость.
story.method.action=Как построено исследование
story.experiment.eyebrow=ОТ НАБЛЮДЕНИЙ К МОДЕЛИ
story.experiment.title=Если повторять ситуацию, насколько меняется результат?
story.experiment.copy=Возьмём наблюдаемую долю сдачи вовремя как вероятность в упрощённой модели. Лаборатория показывает случайные различия между группами, распределение и приближение симуляции к теории. Это учебный эксперимент, а не проверка причины.
story.experiment.action=Открыть лабораторию вероятности
story.csv.action=Скачать сводку CSV
story.latest=Последний ответ в наборе: {0}
story.frequency.title=Какие ответы собраны?
story.frequency.eyebrow=ОТВЕТЫ И ИХ РАСПРЕДЕЛЕНИЯ
story.frequency.intro=Сколько раз выбран каждый вариант и какую долю он составляет. Таблицы сохраняют точные значения, столбцы помогают сравнить категории.
story.eligibility.title=Какие ответы вошли в исследование?
story.eligibility.copy=Первый вопрос проверяет, было ли подходящее индивидуальное задание с первоначальным дедлайном за последние 14 дней. Ниже распределения только подходящих ответов.
story.eligibility.category=Подходит по первому вопросу
story.frequency.sample=Подходящих ответов: {0}
story.frequency.count=Число ответов f
story.frequency.mode=Наиболее частый известный ответ:
story.frequency.modeCount=По {0} из {1} ответов.
story.frequency.denominator=Неизвестных ответов: {0}. Проценты рассчитаны от всех подходящих ответов, включая неизвестные и пока не сданные. Мода определяется среди известных категорий.
story.frequency.nextTitle=Как время начала связано с результатом?
story.frequency.nextCopy=Эти распределения описывают каждый признак отдельно. Для связи между началом работы и сдачей сравним группы на странице исследования.
story.frequency.nextAction=Перейти к сравнению групп
story.frequency.question.allottedBand=Сколько времени было на задание?
story.frequency.question.startBand=Когда студенты начали работу?
story.frequency.question.submissionStatus=Чем закончилась сдача задания?
story.frequency.question.extensionStatus=Переносился ли дедлайн?
story.frequency.question.planning=Как студенты планировали работу?
story.frequency.question.difficulty=Какой казалась сложность задания?
story.frequency.question.otherDeadlines=Сколько других дедлайнов совпало?
story.method.title=Как мы переходим от ответов к выводам?
story.method.eyebrow=ЛОГИКА ИССЛЕДОВАНИЯ
story.method.intro=От одного задания к распределениям, сравнению групп и вероятностному эксперименту.
story.method.01.label=01 / ИССЛЕДОВАТЕЛЬСКИЙ ВОПРОС
story.method.01.title=Связано ли начало работы со сдачей вовремя?
story.method.01.copy=Мы изучаем индивидуальные учебные задания. Главные признаки — время фактического начала работы и результат относительно первоначального дедлайна. Нас интересует связь в собранной выборке, а не причина поведения каждого студента.
story.method.02.label=02 / ГИПОТЕЗА
story.method.02.title=Что ожидаем увидеть?
story.method.02.copy=При одинаковом выданном сроке доля сдачи вовремя выше у тех, кто начал хотя бы за день до дедлайна, чем у начавших в последний день.
story.method.02.caveat=Гипотеза задаёт направление сравнения. Даже подходящая ей разница не доказывает причинность.
story.method.03.label=03 / ЕДИНИЦА НАБЛЮДЕНИЯ
story.method.03.title=Один студент и одно задание
story.method.03.copy=Один ответ описывает последнее индивидуальное задание, первоначальный дедлайн которого прошёл за последние 14 дней. Если таких заданий несколько с одним последним сроком, выбирается одно. 14 дней — период воспоминания, а не срок выполнения.
story.method.03.example=Начало работы — фактическое выполнение, не чтение условия. Используем календарные дни: начать в среду при дедлайне в пятницу означает «за 2 дня».
story.method.04.label=04 / СОБРАННЫЕ ПРИЗНАКИ
story.method.04.title=Что спрашиваем в анкете?
story.method.04.time=Время: сколько дней было выдано и когда началась работа.
story.method.04.outcome=Результат: вовремя, позже, пока не сдано или не помню; отдельно — перенос срока.
story.method.04.context=Контекст: планирование, субъективная сложность и другие дедлайны.
story.method.04.intervals=Сроки и нагрузка заданы категориями, в том числе «8+ дней» и «4+ задания». Из таких ответов нельзя восстановить точное среднее число дней. Сложность — порядковая самооценка, не непрерывное измерение.
story.method.05.label=05 / ЧАСТОТЫ
story.method.05.title=Как описываем собранные ответы?
story.method.05.copy=Частота f — число ответов в категории. Относительная частота — её доля в N подходящих ответах. Неизвестные ответы остаются отдельной категорией. Мода — самый частый известный ответ; при равенстве показываем все такие ответы.
story.method.05.formula=Доля, % = 100 × f / N
story.method.05.chart=Для категорий используем столбчатые диаграммы со шкалой от нуля, для упорядоченных вариантов сохраняем порядок. Открытые интервалы не превращаем в точные числовые наблюдения.
story.method.05.action=Посмотреть распределения ответов
story.method.06.label=06 / СРАВНЕНИЕ ГРУПП
story.method.06.title=Какие группы сравниваем и что стоит в знаменателе?
story.method.06.copy=Основное сравнение — начавшие хотя бы за день и начавшие в день дедлайна. Берём один выбранный выданный срок от 1 дня и только задания без переноса. Остальные фильтры также действуют. Начавшие после срока или ещё не начавшие в эти две группы не входят.
story.method.06.formula=Доля вовремя = вовремя / (вовремя + позже)
story.method.06.denominator=«Пока не сдано» и «не помню» исключены из знаменателя доли, но остаются в частотных распределениях. Разница долей выражается в процентных пунктах, не в процентах роста.
story.method.06.other=Планирование, сложность и нагрузка сравниваются описательно. Перенос дедлайна означает, что первоначальная и новая согласованная даты могут различаться.
story.method.07.label=07 / ВЕРОЯТНОСТНАЯ МОДЕЛЬ
story.method.07.title=Как доля из опроса становится вероятностью?
story.method.07.copy=В режиме наблюдений p — доля сдачи вовремя среди известных результатов выбранной выборки. В ручном режиме p задаёт пользователь. Для группы из n условных студентов X обозначает число сдавших вовремя.
story.method.07.assumptions=Биномиальная модель предполагает одну и ту же p для каждого студента и независимые результаты. Это упрощение: реальные студенты и задания различаются.
story.method.08.label=08 / СИМУЛЯЦИЯ
story.method.08.title=Что происходит при многократном повторении?
story.method.08.copy=Каждое повторение создаёт новую группу из n студентов. Считаем сдавших вовремя, строим эмпирическое распределение и сравниваем его с биномиальной теорией. Хвост X ≥ k означает как минимум k своевременных сдач.
story.method.08.convergence=График сходимости показывает оценку вероятности хвоста после всё большего числа повторений. Закон больших чисел объясняет её приближение к теоретической вероятности; отдельные участки могут временно отдаляться.
story.method.08.sample=Число симуляций не увеличивает размер опроса и не устраняет неопределённость оценённой p. Одинаковое зерно воспроизводит эксперимент; теория рассчитывается в Java с Apache Commons Math.
story.method.09.label=09 / ОГРАНИЧЕНИЯ
story.method.09.title=Почему связь не доказывает причину?
story.method.09.copy=Опрос добровольный и неслучайный. Ответы зависят от памяти. Нагрузка, сложность, опыт и другие факторы могут быть связаны и со стартом, и со сдачей. Даже 120+ ответов не делают выборку представительной для всех студентов.
story.method.09.small=Предупреждение при менее чем 20 известных результатах в группе — правило осторожности интерфейса, а не статистический тест. Мы не называем описательную разницу статистически значимой.
story.method.09.demo=Демонстрационные ответы вымышлены и не являются исследовательскими доказательствами. Реальные и демонстрационные данные не смешиваются. Симуляция иллюстрирует вероятность, а не причинное предсказание.
story.quiz.eyebrow=ПРОВЕРЬТЕ ИНТУИЦИЮ
story.quiz.title=Обязательно ли ровно шесть?
story.quiz.question=Если вероятность сдачи вовремя — 30%, обязательно ли в группе из 20 студентов ровно 6 сдадут вовремя?
story.quiz.yes=Да, потому что 30% от 20 равно 6
story.quiz.no=Нет, результат отдельной группы случаен
story.quiz.check=Проверить ответ
story.quiz.correct=Верно.
story.quiz.incorrect=Не совсем.
story.quiz.explanation=6 — математическое ожидание. Отдельная группа может дать другой результат; при большом числе групп среднее приближается к 6.
story.quiz.action=Проверить в лаборатории
