study.notation.describe=N — число подходящих наблюдений, включая неизвестные ответы; y_j — ответ j, c_i — категория i. Доли определены при N > 0.
study.notation.compare=S — сдали вовремя; L — сдали позже. Наблюдаемые доли p̂ выражены числами от 0 до 1.
study.notation.model=X — число сдавших вовремя; n — размер моделируемой группы; k — число успешных исходов; p — вероятность одной сдачи вовремя, от 0 до 1.
study.notation.simulation=M — число симуляций; H — число симуляций, в которых произошло выбранное событие. Здесь событие: X ≥ k.
study.notation.grouping=M — число моделируемых групп; x_min и x_max — наблюдаемые числа сдавших вовремя. Интервалы ответов анкеты остаются категориями, а не равными числовыми классами.
study.formula.used=Применение:
study.formula.frequency.name=Абсолютная частота
study.formula.frequency.meaning=f_i — число наблюдений, в которых ответ относится к категории i.
study.formula.frequency.use=Подсчёт ответов по семи признакам в таблицах и диаграммах данных.
study.formula.relative.name=Относительная частота
study.formula.relative.meaning=r_i — доля категории среди N наблюдений, выраженная числом от 0 до 1.
study.formula.relative.use=Сравнение размеров категорий и расчёт процентов.
study.formula.percentage.name=Процентная доля
study.formula.percentage.meaning=q_i — доля категории, выраженная в процентах.
study.formula.percentage.use=Проценты распределений в обзоре, диаграммах и точных таблицах данных.
study.formula.mode.name=Мода
study.formula.mode.meaning=Категория с максимальной положительной частотой f_max среди известных ответов. При равенстве частот мод несколько; при нулевых частотах моды нет.
study.formula.mode.use=Определение наиболее частого ответа; неизвестная категория исключена.
study.formula.observed.name=Наблюдаемая вероятность сдачи вовремя
study.formula.observed.meaning=Доля сдачи вовремя среди известных завершённых исходов. Пока не сдали и неизвестные результаты в знаменатель не входят.
study.formula.observed.use=Основной результат обзора, сравнение категорий и наблюдаемая p в лаборатории.
study.formula.difference.name=Разность в процентных пунктах
study.formula.difference.meaning=Разность двух долей на шкале процентов. Процентное изменение рассчитывалось бы как 100(p̂₁ − p̂₂)/p̂₂ при p̂₂ > 0.
study.formula.difference.use=Сравнение наблюдаемых долей между группами. Положительный знак означает, что первая доля выше.
study.formula.combinations.name=Число сочетаний
study.formula.combinations.meaning=Число способов выбрать k студентов из n без учёта порядка.
study.formula.combinations.use=Коэффициент биномиальной вероятности при 0 ≤ k ≤ n.
study.formula.binomial.name=Биномиальная вероятность
study.formula.binomial.meaning=Вероятность ровно k успехов в n независимых испытаниях с общей p. При p = 0 или 1 значение X равно 0 или n с вероятностью 1.
study.formula.binomial.use=Теоретическое распределение числа сдавших вовремя в лаборатории.
study.formula.expected.name=Математическое ожидание
study.formula.expected.meaning=Среднее число сдавших вовремя при многократном повторении групп; отдельная группа может дать другое число.
study.formula.expected.use=Ожидаемое число и сравнение моделируемых групп в лаборатории.
study.formula.variance.name=Биномиальная дисперсия
study.formula.variance.meaning=Средний квадрат отклонения X от np; измеряется в квадрате числа исходов.
study.formula.variance.use=Описание теоретического разброса биномиальной модели.
study.formula.deviation.name=Биномиальное стандартное отклонение
study.formula.deviation.meaning=Теоретический разброс в единицах числа студентов; квадратный корень из дисперсии.
study.formula.deviation.use=Биномиальная модель. Выборочное отклонение в сгруппированной симуляции использует делитель M − 1.
study.formula.tail.name=Вероятность «не менее k»
study.formula.tail.meaning=Вероятность хотя бы k сдач вовремя: сумма вероятностей от k до n.
study.formula.tail.use=Пороговое событие и сравнение теории с симуляцией в лаборатории.
study.formula.empirical.name=Эмпирическая вероятность
study.formula.empirical.meaning=Доля H симуляций, в которых X ≥ k, среди M повторений.
study.formula.empirical.use=Оценка методом Монте-Карло и график сходимости.
study.formula.error.name=Абсолютная разность симуляции и теории
study.formula.error.meaning=Разность на шкале вероятностей; 100ε — разность в процентных пунктах.
study.formula.error.use=Сопоставление симуляции с теорией; это не доверительная граница.
study.formula.range.name=Размах
study.formula.range.meaning=Разность максимального и минимального числа сдавших вовремя, полученных в симуляции.
study.formula.range.use=Границы группировки наблюдаемых числовых результатов симуляции.
study.formula.sturges.name=Правило Стерджеса
study.formula.sturges.meaning=Рекомендованное число классов: K₀ округляется до ближайшего целого, затем K ограничивается снизу единицей.
study.formula.sturges.use=Только числовые результаты симуляции; фактических интервалов может быть меньше K.
study.formula.width.name=Ширина класса
study.formula.width.meaning=Приближённо C = R/K. Для целых значений проект округляет (R + 1)/K вверх и берёт минимум 1; добавленная единица учитывает обе границы.
study.formula.width.use=Интервалы числовой симуляции [a, a + C − 1]; последний может выходить за наблюдаемый максимум.
study.example.title=Расчёт по текущим данным
study.example.onTime=Вовремя
study.example.late=Позже
study.example.known=Известный исход
study.example.empty=Наблюдаемая доля не определена: известных завершённых исходов пока нет.
study.limitations.title=Ограничения
study.limitations.sample=Добровольная неслучайная выборка описывает этих участников. Сроки, указанные самими участниками, могут быть неточными или противоречивыми.
study.limitations.outcome=Доли относятся к известным завершённым исходам; ожидающие и неизвестные результаты исключены.
study.limitations.association=Различия между группами описывают связь, а не причинный эффект или статистическую значимость.
study.limitations.model=Биномиальная модель предполагает независимые исходы с общей p. Симуляция не добавляет наблюдений опроса.
study.limits.causation=Наблюдаемая связь не доказывает, что более раннее начало стало причиной сдачи вовремя.
