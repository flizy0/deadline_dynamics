study.limitations.title=Limitations
study.limitations.sample=Voluntary, non-random responses describe this sample. Self-reported timing can be inaccurate or inconsistent.
study.limitations.outcome=Rates describe completed, known outcomes; pending and unknown submissions are excluded.
study.limitations.association=Group differences are descriptive associations, not causal effects or significance tests.
study.limitations.model=The binomial model assumes independent outcomes with common p. Simulation adds no survey observations.
study.limits.causation=An observed association does not prove that starting earlier caused an on-time submission.
