study.notation.describe=N is the number of eligible observations, including unknown answers; y_j is response j and c_i is category i. Ratios require N > 0.
study.notation.compare=S counts on-time submissions; L counts late submissions. Observed proportions p̂ are on the 0–1 scale.
study.notation.model=X counts on-time submissions; n is the simulated group size; k is the number of successes; p is one on-time probability, from 0 to 1.
study.notation.simulation=M is the number of simulation runs; H counts runs satisfying the chosen event. Here the event is X ≥ k.
study.notation.grouping=M counts simulated groups; x_min and x_max are observed on-time counts. Survey answer bands retain their original categories, rather than becoming equal-width numerical classes.
study.formula.used=Used in:
study.formula.frequency.name=Absolute frequency
study.formula.frequency.meaning=f_i counts observations whose answer belongs to category i.
study.formula.frequency.use=Counts of the seven survey variables in data tables and diagrams.
study.formula.relative.name=Relative frequency
study.formula.relative.meaning=r_i is a category’s share of N observations, on the 0–1 scale.
study.formula.relative.use=Comparing category sizes and calculating percentages.
study.formula.percentage.name=Percentage
study.formula.percentage.meaning=q_i expresses a category’s share as a percentage.
study.formula.percentage.use=Distribution percentages in Overview, data diagrams and exact tables.
study.formula.mode.name=Mode
study.formula.mode.meaning=The category with the greatest positive frequency f_max among known answers. Ties give multiple modes; zero counts give no mode.
study.formula.mode.use=Identifying the most common response, excluding the unknown category.
study.formula.observed.name=Observed on-time probability
study.formula.observed.meaning=The on-time share among completed, known outcomes. Pending and unknown submissions are outside the denominator.
study.formula.observed.use=The main Overview result, category comparisons and observed p in Probability Lab.
study.formula.difference.name=Percentage-point difference
study.formula.difference.meaning=The difference between two proportions on the percentage scale. Percent change would instead be 100(p̂₁ − p̂₂)/p̂₂, for p̂₂ > 0.
study.formula.difference.use=Comparing observed group proportions. A positive value means the first proportion is higher.
study.formula.combinations.name=Combinations
study.formula.combinations.meaning=The number of ways to choose k students from n, regardless of order.
study.formula.combinations.use=The coefficient in binomial probabilities, for 0 ≤ k ≤ n.
study.formula.binomial.name=Binomial probability mass function
study.formula.binomial.meaning=The probability of exactly k successes in n independent trials with common p. At p = 0 or 1, X is 0 or n with certainty.
study.formula.binomial.use=The theoretical on-time count distribution in Probability Lab.
study.formula.expected.name=Expected value
study.formula.expected.meaning=The mean on-time count over repeated groups; a single group may differ.
study.formula.expected.use=The expected count and simulated group comparisons in Probability Lab.
study.formula.variance.name=Binomial variance
study.formula.variance.meaning=The mean squared distance of X from np, measured in squared counts.
study.formula.variance.use=The theoretical spread of the binomial model.
study.formula.deviation.name=Binomial standard deviation
study.formula.deviation.meaning=The theoretical spread in student counts, equal to the square root of the variance.
study.formula.deviation.use=The binomial model. Grouped simulation sample deviation instead uses the M − 1 divisor.
study.formula.tail.name=Tail probability
study.formula.tail.meaning=The chance of at least k on-time submissions: add the probabilities from k through n.
study.formula.tail.use=The threshold event and theory/simulation comparison in Probability Lab.
study.formula.empirical.name=Empirical probability
study.formula.empirical.meaning=The share of H runs satisfying X ≥ k among M repeated simulations.
study.formula.empirical.use=Monte Carlo estimation and the convergence plot.
study.formula.error.name=Absolute simulation difference
study.formula.error.meaning=The difference on the probability scale; 100ε is the difference in percentage points.
study.formula.error.use=Comparing simulation with theory; this is not a confidence bound.
study.formula.range.name=Range
study.formula.range.meaning=The difference between the highest and lowest on-time counts actually observed in simulation.
study.formula.range.use=Bounds for grouping numerical simulation results.
study.formula.sturges.name=Sturges’ rule
study.formula.sturges.meaning=The suggested class count: round K₀ to the nearest integer, then keep K at least 1.
study.formula.sturges.use=Numerical simulation results only; the actual interval count can be smaller than K.
study.formula.width.name=Class width
study.formula.width.meaning=Approximately C = R/K. For integers, the project rounds (R + 1)/K upwards and keeps a minimum of 1; the added 1 includes both endpoints.
study.formula.width.use=Numerical simulation intervals [a, a + C − 1]; the last can extend beyond the observed maximum.
