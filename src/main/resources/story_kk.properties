story.experiment.title=Жағдайды қайталасақ, нәтиже қаншалықты өзгереді?
story.experiment.copy=Уақытында тапсырудың бақыланған үлесін қарапайым модельдегі ықтималдық ретінде аламыз. Зертхана топтар арасындағы кездейсоқ айырманы, үлестірімді және симуляцияның теорияға жақындауын көрсетеді. Бұл себепті тексеру емес, оқу эксперименті.
