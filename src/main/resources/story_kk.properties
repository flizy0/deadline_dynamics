story.method.title=Жауаптардан қорытындыға қалай өтеміз?
story.method.eyebrow=ЗЕРТТЕУ ЛОГИКАСЫ
story.method.intro=Бір тапсырмадан үлестірімдерге, топтарды салыстыруға және ықтималдық экспериментіне дейін.
story.method.01.label=01 / ЗЕРТТЕУ СҰРАҒЫ
story.method.01.title=Жұмысты бастау уақытында тапсырумен байланысты ма?
story.method.01.copy=Біз жеке оқу тапсырмаларын зерттейміз. Негізгі белгілер — жұмыстың нақты басталу уақыты және бастапқы дедлайнға қатысты нәтиже. Бізді әр студенттің мінез-құлқының себебі емес, жиналған іріктемедегі байланыс қызықтырады.
story.method.02.label=02 / ГИПОТЕЗА
story.method.02.title=Қандай нәтиже күтеміз?
story.method.02.copy=Берілген мерзім бірдей болғанда, дедлайннан кемінде бір күн бұрын бастағандардың уақытында тапсыру үлесі соңғы күні бастағандарға қарағанда жоғары болады деп күтеміз.
story.method.02.caveat=Гипотеза салыстырудың бағытын анықтайды. Оған сәйкес айырма табылса да, бұл себептілікті дәлелдемейді.
story.method.03.label=03 / БАҚЫЛАУ БІРЛІГІ
story.method.03.title=Бір студент және бір тапсырма
story.method.03.copy=Бір жауап бастапқы дедлайны соңғы 14 күнде өткен соңғы жеке тапсырманы сипаттайды. Соңғы дедлайны бірдей бірнеше тапсырма болса, біреуі таңдалады. 14 күн — орындау мерзімі емес, еске түсіру кезеңі.
story.method.03.example=Жұмысты бастау — шартты оқу емес, нақты орындауға кірісу. Күнтізбелік күндерді қолданамыз: жұмадағы дедлайн үшін сәрсенбіде бастау «2 күн бұрын» дегенді білдіреді.
story.method.04.label=04 / ЖИНАЛҒАН БЕЛГІЛЕР
story.method.04.title=Сауалнамада не сұраймыз?
story.method.04.time=Уақыт: қанша күн берілді және жұмыс қашан басталды.
story.method.04.outcome=Нәтиже: уақытында, кеш, әлі тапсырылмады немесе есімде жоқ; мерзімнің ұзартылуы бөлек сұралады.
story.method.04.context=Мәнмәтін: жоспарлау, субъективті күрделілік және басқа дедлайндар.
story.method.04.intervals=Мерзім мен жүктеме «8+ күн» және «4+ тапсырма» сияқты санаттармен берілген. Мұндай жауаптардан күн санының дәл орташа мәнін қалпына келтіру мүмкін емес. Күрделілік — үздіксіз өлшем емес, реттік өзіндік баға.
story.method.05.label=05 / ЖИІЛІКТЕР
story.method.05.title=Жиналған жауаптарды қалай сипаттаймыз?
story.method.05.copy=f жиілігі — санаттағы жауап саны. Салыстырмалы жиілік — сол санаттың N жарамды жауап ішіндегі үлесі. Белгісіз жауаптар бөлек санат болып қалады. Мода — ең жиі кездесетін белгілі жауап; жиіліктер тең болса, барлығы көрсетіледі.
story.method.05.formula=Үлес, % = 100 × f / N
story.method.05.chart=Санаттарға нөлден басталатын баған диаграммаларын қолданамыз, реттелген нұсқалардың ретін сақтаймыз. Ашық аралықтарды дәл сандық бақылау деп қабылдамаймыз.
story.method.05.action=Жауаптардың үлестірімдерін көру
story.method.06.label=06 / ТОПТАРДЫ САЛЫСТЫРУ
story.method.06.title=Қай топтарды салыстырамыз және бөлімге не кіреді?
story.method.06.copy=Негізгі салыстыру — кемінде бір күн бұрын бастағандар мен дедлайн күні бастағандар. Кемінде 1 күндік бір таңдалған мерзімді және мерзімі ұзартылмаған тапсырмаларды аламыз. Басқа сүзгілер де қолданылады. Дедлайннан кейін бастағандар мен әлі бастамағандар бұл екі топқа кірмейді.
story.method.06.formula=Уақытында тапсыру үлесі = уақытында / (уақытында + кеш)
story.method.06.denominator=«Әлі тапсырылмады» және «есімде жоқ» үлестің бөлімінен шығарылады, бірақ жиілік үлестірімдерінде қалады. Үлестердің айырмасы өсу пайызымен емес, пайыздық тармақпен беріледі.
story.method.06.other=Жоспарлау, күрделілік және жүктеме сипаттамалық түрде салыстырылады. Мерзімді ұзарту бастапқы және жаңа келісілген күндердің әртүрлі болуы мүмкін екенін білдіреді.
story.method.07.label=07 / ЫҚТИМАЛДЫҚ МОДЕЛІ
story.method.07.title=Сауалнамадағы үлес ықтималдыққа қалай айналады?
story.method.07.copy=Бақылау режимінде p — таңдалған іріктемедегі нәтижесі белгілі жауаптардың уақытында тапсыру үлесі. Қолмен енгізу режимінде p мәнін пайдаланушы береді. n шартты студент тобында X уақытында тапсырғандар санын білдіреді.
story.method.07.assumptions=Биномиалдық модель әр студентке бірдей p және нәтижелердің тәуелсіздігін болжайды. Бұл — жеңілдету: нақты студенттер мен тапсырмалар әртүрлі.
story.method.08.label=08 / СИМУЛЯЦИЯ
story.method.08.title=Көп рет қайталағанда не болады?
story.method.08.copy=Әр қайталау n студенттен тұратын жаңа топ құрады. Уақытында тапсырғандарды санап, эмпирикалық үлестірімді құрамыз және биномиалдық теориямен салыстырамыз. X ≥ k құйрығы кемінде k уақытында тапсыруды білдіреді.
story.method.08.convergence=Жинақталу графигі қайталау саны өскен сайын құйрық ықтималдығының бағасын көрсетеді. Үлкен сандар заңы оның теориялық ықтималдыққа жақындауын түсіндіреді; кей бөліктер уақытша алыстауы мүмкін.
story.method.08.sample=Симуляция саны сауалнама іріктемесін ұлғайтпайды және бағаланған p белгісіздігін жоймайды. Бірдей бастапқы тұқым экспериментті қайта өндіреді; теория Java-да Apache Commons Math арқылы есептеледі.
story.method.09.label=09 / ШЕКТЕУЛЕР
story.method.09.title=Неліктен байланыс себепті дәлелдемейді?
story.method.09.copy=Сауалнама ерікті және кездейсоқ емес. Жауаптар есте сақтауға тәуелді. Жүктеме, күрделілік, тәжірибе және басқа факторлар бастау уақытына да, тапсыруға да байланысты болуы мүмкін. Тіпті 120-дан астам жауап іріктемені барлық студентке өкілді етпейді.
story.method.09.small=Топта нәтижесі белгілі жауап 20-дан аз болғандағы ескерту — статистикалық тест емес, интерфейстегі сақтық ережесі. Сипаттамалық айырманы статистикалық мәнді деп атамаймыз.
story.method.09.demo=Демонстрациялық жауаптар ойдан шығарылған және зерттеу дәлелі болып саналмайды. Нақты және демонстрациялық деректер араласпайды. Симуляция себептік болжам емес, ықтималдықты көрсетеді.
story.quiz.eyebrow=ТҮЙСІГІҢІЗДІ ТЕКСЕРІҢІЗ
story.quiz.title=Міндетті түрде дәл алтау ма?
story.quiz.question=Уақытында тапсыру ықтималдығы 30% болса, 20 студент тобында міндетті түрде дәл 6 студент уақытында тапсыра ма?
story.quiz.yes=Иә, себебі 20-ның 30%-ы 6-ға тең
story.quiz.no=Жоқ, жеке топтың нәтижесі кездейсоқ
story.quiz.check=Жауапты тексеру
story.quiz.correct=Дұрыс.
story.quiz.incorrect=Толық дұрыс емес.
story.quiz.explanation=6 — математикалық күтім. Жеке топтың нәтижесі басқаша болуы мүмкін; топ саны көбейгенде орташа мән 6-ға жақындайды.
story.quiz.action=Зертханада тексеру
