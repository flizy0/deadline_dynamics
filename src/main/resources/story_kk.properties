story.frequency.denominator=Белгісіз жауаптар: {0}. Пайыздар белгісіз және әлі тапсырылмаған нәтижелерді қоса, барлық жарамды жауаптан есептелген. Мода белгілі санаттардың арасынан анықталады.
story.frequency.nextTitle=Бастау уақыты нәтижемен қалай байланысты?
story.frequency.nextCopy=Бұл үлестірімдер әр белгіні бөлек сипаттайды. Жұмысты бастау мен тапсыру арасындағы байланысты зерттеу бетінде топтарды салыстырып қараймыз.
