story.limitations.title=Қандай қорытынды жасауға болады, қандайын жасауға болмайды?
story.limitations.copy=Біз осы ерікті, кездейсоқ емес іріктеменің жауаптарын сипаттаймыз. Ол барлық студенттерді білдірмейді. Есте сақтау, жүктеме, күрделілік және тәжірибе жұмысты бастауға да, нәтижеге де байланысты болуы мүмкін. Бақыланған айырма себептілікті немесе статистикалық мәнділікті дәлелдемейді.
