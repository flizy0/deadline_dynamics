story.frequency.eyebrow=ЖАУАПТАР ЖӘНЕ ОЛАРДЫҢ ҮЛЕСТІРІМДЕРІ
story.frequency.intro=Әр нұсқа неше рет таңдалған және оның үлесі қандай? Кестелер нақты мәндерді сақтайды, ал бағандар санаттарды салыстыруға көмектеседі.
story.eligibility.title=Қай жауаптар зерттеуге кірді?
story.eligibility.copy=Бірінші сұрақ бастапқы дедлайны соңғы 14 күнде өткен жеке тапсырма болғанын тексереді. Төмендегі үлестірімдер тек жарамды жауаптардан құрылған.
story.eligibility.category=Бірінші сұраққа сай келеді
