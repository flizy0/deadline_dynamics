services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: deadline_lab
      POSTGRES_USER: deadline
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - deadline-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadline -d deadline_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: deadline_lab
      DB_USER: deadline
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8085
    depends_on:
      db:
        condition: service_healthy
volumes:
  deadline-data:
